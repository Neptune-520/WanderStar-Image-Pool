<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漫游星图 (WanderStar Image Pool) 管理后台</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/style.css?v=4">
</head>
<body>
  <div id="login-view" class="view-container active">
    <div class="glass-card login-card">
      <div class="login-header">
        <h1>后台登录</h1>
        <p>请输入管理员账号和密码</p>
      </div>
      <form id="login-form">
        <div class="input-group">
          <input type="text" id="username" placeholder="Username" required />
        </div>
        <div class="input-group">
          <input type="password" id="password" placeholder="Password" required />
        </div>
        <button type="button" id="btn-login" class="btn-primary">进入</button>
        <div id="login-error" class="error-text"></div>
      </form>
    </div>
  </div>

  <div id="dashboard-view" class="view-container dashboard-layout">
    
    <aside class="sidebar glass-panel">
      <div class="sidebar-header">
        <h2>✨ 漫游星图</h2>
      </div>
      
      <div class="sidebar-section">
        <div class="sidebar-title">
          <span>端点管理</span>
          <button id="btn-add-category" class="btn-icon-small" title="新增端点">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
        <ul id="sidebar-category-list" class="sidebar-nav">
        </ul>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">系统操作</div>
        <ul class="sidebar-nav">
          <li id="nav-settings" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            系统设置
          </li>
          <li class="nav-item">
            <a href="/" target="_blank" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:8px; width:100%;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
              查看前台
            </a>
          </li>
          <li id="btn-logout" class="nav-item text-danger">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            退出登录
          </li>
        </ul>
      </div>
    </aside>

    <main class="main-content">
      
      <div id="panel-category" class="content-panel glass-panel hidden">
        <div class="panel-header">
          <div>
            <h2 style="display:flex; align-items:center; gap:8px;">
              <span id="manage-cat-title">选择一个端点</span>
              <a id="manage-cat-link" href="#" target="_blank" style="font-size:14px; font-weight:normal; color:var(--primary); display:none;"></a>
            </h2>
          </div>
          <div class="panel-actions">
            <button id="btn-edit-category" class="btn-secondary">编辑端点</button>
            <button id="btn-reset-cat-auto" class="btn-secondary">清除自动熔断</button>
            <button id="btn-reset-cat-manual" class="btn-secondary">清除手动封禁</button>
            <button id="btn-add-api-in-cat" class="btn-primary">+ 添加新 API</button>
          </div>
        </div>
        <div class="panel-body">
          <div id="manage-cat-apis-list" class="api-management-list">
            <div class="empty-state">请从左侧选择一个端点进行管理</div>
          </div>
        </div>
      </div>

      <div id="panel-settings" class="content-panel glass-panel hidden">
        <div class="panel-header">
          <h2>系统设置</h2>
        </div>
        <div class="panel-body">
          
          <form id="form-settings">
            <div class="settings-card">
              <h3>公开域名设置</h3>
              <div class="input-group" style="max-width: 400px;">
                <input type="url" id="setting-public_domain" placeholder="https://..." style="width:100%;">
              </div>
            </div>
            
            <div class="settings-card">
              <h3>API 请求调度</h3>
              <div style="display:flex; gap:16px;">
                <div class="input-group" style="flex:1;">
                  <label>请求重试次数</label>
                  <input type="number" id="setting-api_retry_count" min="1" max="10">
                </div>
                <div class="input-group" style="flex:1;">
                  <label>单次超时时间 (ms)</label>
                  <input type="number" id="setting-api_timeout_ms" min="100" max="10000">
                </div>
              </div>
            </div>

            <div class="settings-card">
              <h3>基础网站配置 (前台)</h3>
              <div class="input-group">
                <label>网站名称</label>
                <input type="text" id="setting-site_name" placeholder="WanderStar Image Pool">
              </div>
              <div class="input-group">
                <label>Logo URL (支持图床链接或 svg 代码)</label>
                <input type="text" id="setting-site_logo">
              </div>
              <div class="input-group">
                <label>主页显示文本内容</label>
                <input type="text" id="setting-home_text">
              </div>
              <div class="input-group">
                <label>公告弹窗内容 (支持HTML)</label>
                <textarea id="setting-announcement" rows="3"></textarea>
              </div>
              <div class="input-group">
                <label>底部版权信息 (支持HTML)</label>
                <input type="text" id="setting-footer_info">
              </div>
              <div class="input-group">
                <label>背景设置类型</label>
                <select id="setting-bg_type">
                  <option value="color">纯色</option>
                  <option value="gradient">渐变色</option>
                  <option value="image">图片链接</option>
                </select>
              </div>
              <div class="input-group">
                <label>背景设置值 (色值/渐变代码/图片URL)</label>
                <input type="text" id="setting-bg_value" placeholder="#0f172a / linear-gradient(...) / https://...">
              </div>
            </div>

            <div class="settings-card">
              <h3>联系页配置</h3>
              <div class="input-group">
                <label>联系图片/二维码 URL</label>
                <input type="text" id="setting-contact_image">
              </div>
              <div class="input-group">
                <label>联系展示文字 (支持HTML)</label>
                <textarea id="setting-contact_text" rows="3"></textarea>
              </div>
              <div class="input-group">
                <label>社交媒体链接 (JSON数组格式，如 [{"name":"GitHub", "url":"..."}])</label>
                <textarea id="setting-contact_socials" rows="3"></textarea>
              </div>
            </div>

            <div class="settings-card">
              <button type="submit" class="btn-primary" style="width:100px;">保存设置</button>
            </div>
          </form>

          <div class="settings-card">
            <h3>修改管理员账号与密码</h3>
            <form id="form-change-pwd" style="max-width: 300px; margin-top:16px;">
              <div class="input-group">
                <input type="text" id="old-username" required placeholder="当前账号">
              </div>
              <div class="input-group">
                <input type="password" id="old-pwd" required placeholder="当前密码">
              </div>
              <div class="input-group">
                <input type="password" id="new-pwd" required placeholder="新密码">
              </div>
              <button type="submit" class="btn-primary">修改</button>
            </form>
          </div>

        </div>
      </div>

    </main>
  </div>

  <div class="modal-overlay" id="modal-add-category">
    <div class="glass-modal">
      <h3 id="cat-modal-title">新增端点</h3>
      <form id="form-add-category">
        <input type="hidden" id="cat-is-edit" value="0" />
        <input type="hidden" id="cat-old-name" value="" />
        
        <div class="input-group">
          <label>端点名称 (中文/英文，如：电脑壁纸)</label>
          <input type="text" id="cat-display-name" required>
        </div>
        <div class="input-group">
          <label>URL Slug (仅英文/数字，如：pc)</label>
          <input type="text" id="cat-name" placeholder="e.g. pc, mobile" required pattern="[A-Za-z0-9_-]+">
        </div>
        <div class="input-group">
          <label>端点描述 (展示在前台)</label>
          <textarea id="cat-description" rows="2" placeholder="调用该接口获取随机图片"></textarea>
        </div>
        
        <div class="modal-actions">
          <button type="button" class="btn-text btn-close-modal">取消</button>
          <button type="submit" class="btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="modal-add-api">
    <div class="glass-modal">
      <h3 id="api-modal-title">添加新 API</h3>
      <form id="form-add-api">
        <input type="hidden" id="api-cat-name" />
        <input type="hidden" id="api-is-edit" value="0" />
        <input type="hidden" id="api-old-id" value="" />
        
        <div class="input-group">
          <label>API 唯一ID</label>
          <input type="text" id="api-id" placeholder="e.g. api-1" required>
        </div>
        
        <div class="input-group">
          <label>接口地址 (URL)</label>
          <input type="url" id="api-url" placeholder="https://api.example.com/img" required>
        </div>

        <div class="input-group">
          <label>接口类型</label>
          <select id="api-type">
            <option value="direct">直接返回图片/重定向 (Direct)</option>
            <option value="json">返回 JSON 格式</option>
          </select>
        </div>

        <div class="input-group" id="json-path-group" style="display: none;">
          <label>图片URL在JSON中的路径</label>
          <input type="text" id="api-json-path" placeholder="e.g. data.img_url">
          <small>仅当接口类型为 JSON 时必填</small>
        </div>
        
        <div class="modal-actions">
          <button type="button" class="btn-text btn-close-modal">取消</button>
          <button type="submit" class="btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script src="/admin/app.js?v=4"></script>
</body>
</html>
