<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漫游星图 (WanderStar Image Pool) 管理后台</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/style.css?v=3">
</head>
<body>
  <div id="login-view" class="view-container active">
    <div class="glass-card login-card">
      <div class="login-header">
        <h1>后台登录</h1>
        <p>请输入管理员密码进入系统</p>
      </div>
      <form id="login-form">
        <div class="input-group">
          <input type="password" id="password" placeholder="Admin Password" required />
        </div>
        <button type="button" id="btn-login" class="btn-primary">进入</button>
        <div id="login-error" class="error-text"></div>
      </form>
    </div>
  </div>

  <div id="dashboard-view" class="view-container dashboard-layout">
    
    <aside class="sidebar glass-panel">
      <div class="sidebar-header">
        <h2>✨ 漫游星图</h2>
        <span class="badge">Admin</span>
      </div>
      
      <div class="sidebar-section">
        <div class="sidebar-title">
          <span>分类管理</span>
          <button id="btn-add-category" class="btn-icon-small" title="新增分类">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
        <ul id="sidebar-category-list" class="sidebar-nav">
        </ul>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">系统操作</div>
        <ul class="sidebar-nav">
          <li id="nav-settings" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            系统设置
          </li>
          <li class="nav-item">
            <a href="/" target="_blank" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:8px; width:100%;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
              查看对外主页
            </a>
          </li>
          <li id="btn-logout" class="nav-item text-danger">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            退出登录
          </li>
        </ul>
      </div>
    </aside>

    <main class="main-content">
      
      <div id="panel-category" class="content-panel glass-panel hidden">
        <div class="panel-header">
          <div>
            <h2 id="manage-cat-title">选择一个分类</h2>
            <p id="manage-cat-subtitle" class="subtitle">管理该分类下的所有 API</p>
          </div>
          <div class="panel-actions">
            <button id="btn-add-api-in-cat" class="btn-primary">+ 添加新 API</button>
            <button id="btn-delete-cat" class="btn-secondary danger-outline">删除分类</button>
          </div>
        </div>
        <div class="panel-body">
          <div id="manage-cat-apis-list" class="api-management-list">
            <div class="empty-state">请从左侧选择一个分类进行管理</div>
          </div>
        </div>
      </div>

      <div id="panel-settings" class="content-panel glass-panel hidden">
        <div class="panel-header">
          <h2>系统设置</h2>
          <p class="subtitle">配置全局参数与管理员权限</p>
        </div>
        <div class="panel-body">
          
          <div class="settings-card">
            <h3>公开域名设置</h3>
            <p class="settings-desc">设置对外展示的域名，留空则自动获取请求主机的 IP 或域名。示例: https://api.mydomain.com</p>
            <div class="input-group" style="max-width: 400px; display:flex; gap:12px;">
              <input type="url" id="input-public-domain" placeholder="https://..." style="flex:1;">
              <button id="btn-save-domain" class="btn-primary">保存</button>
            </div>
          </div>

          <div class="settings-card">
            <h3>运维操作</h3>
            <div style="display:flex; gap:16px; margin-top:16px;">
              <button id="btn-reset" class="btn-secondary">一键解封所有自动熔断</button>
              <button id="btn-reset-manual" class="btn-secondary danger-outline">清除所有手动封禁</button>
            </div>
          </div>

          <div class="settings-card">
            <h3>修改管理员密码</h3>
            <form id="form-change-pwd" style="max-width: 300px; margin-top:16px;">
              <div class="input-group">
                <input type="password" id="old-pwd" required placeholder="原密码">
              </div>
              <div class="input-group">
                <input type="password" id="new-pwd" required placeholder="新密码">
              </div>
              <button type="submit" class="btn-primary">修改密码</button>
            </form>
          </div>

        </div>
      </div>

    </main>
  </div>

  <div class="modal-overlay" id="modal-add-category">
    <div class="glass-modal">
      <h3>新增分类</h3>
      <form id="form-add-category">
        <div class="input-group">
          <label>分类名称 (只允许英文字母，用作URL路径)</label>
          <input type="text" id="cat-name" placeholder="e.g. pc, mobile, anime" required pattern="[A-Za-z0-9_-]+">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-text btn-close-modal">取消</button>
          <button type="submit" class="btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="modal-add-api">
    <div class="glass-modal">
      <h3>添加新 API</h3>
      <form id="form-add-api">
        <input type="hidden" id="api-cat-name" />
        
        <div class="input-group">
          <label>API 唯一ID</label>
          <input type="text" id="api-id" placeholder="e.g. anime-api-1" required>
        </div>
        
        <div class="input-group">
          <label>接口地址 (URL)</label>
          <input type="url" id="api-url" placeholder="https://api.example.com/img" required>
        </div>

        <div class="input-group">
          <label>接口类型</label>
          <select id="api-type">
            <option value="direct">直接返回图片/重定向 (Direct)</option>
            <option value="json">返回 JSON 格式</option>
          </select>
        </div>

        <div class="input-group" id="json-path-group" style="display: none;">
          <label>图片URL在JSON中的路径</label>
          <input type="text" id="api-json-path" placeholder="e.g. data.img_url">
          <small>仅当接口类型为 JSON 时必填</small>
        </div>
        
        <div class="modal-actions">
          <button type="button" class="btn-text btn-close-modal">取消</button>
          <button type="submit" class="btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script src="/admin/app.js?v=3"></script>
</body>
</html>
