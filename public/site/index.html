<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RandPic - 高性能随机图床聚合 API</title>
  <link rel="stylesheet" href="/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="bg-shape bg-shape-3"></div>

  <div class="container">
    <header class="glass-panel header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span>RandPic API</span>
      </div>
      <a href="/admin" class="btn btn-outline" target="_blank">管理后台</a>
    </header>

    <main>
      <section class="hero glass-panel">
        <div class="hero-content">
          <h1>高性能的随机图片 API 聚合器</h1>
          <p class="subtitle">通过统一的接口，享受多数据源高可用、自动熔断、极速分发的图片调用体验。支持一键接入您的应用与网站。</p>
        </div>
      </section>

      <section class="categories-section">
        <h2 class="section-title">可用图片接口</h2>
        <div id="categories-grid" class="categories-grid">
          <div class="loading-state">正在获取可用接口...</div>
        </div>
      </section>
    </main>
    
    <footer class="footer">
      <p>Powered by RandPic | <a href="https://github.com" target="_blank">Open Source</a></p>
    </footer>
  </div>

  <div id="toast" class="toast">复制成功!</div>

  <script src="/app.js"></script>
</body>
</html>
