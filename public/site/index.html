<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">漫游星图 (WanderStar Image Pool)</title>
  <link rel="stylesheet" href="/style.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body id="dynamic-body">
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="bg-shape bg-shape-3"></div>

  <div class="container">
    <header class="glass-panel header">
      <div class="logo">
        <div id="dynamic-logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </div>
        <span id="dynamic-site-name">漫游星图 API</span>
      </div>
      <nav class="top-nav">
        <a href="#" class="nav-link active" data-target="view-home">首页</a>
        <a href="#" class="nav-link" data-target="view-api">API</a>
        <a href="#" class="nav-link" data-target="view-contact">联系</a>
      </nav>
    </header>

    <main id="main-content">
      <!-- 首页视图 -->
      <div id="view-home" class="page-view active">
        <section class="hero glass-panel">
          <div class="hero-content">
            <h1 id="home-title">高性能的随机图片 API 聚合器</h1>
            <p id="home-subtitle" class="subtitle">通过统一的接口，享受多数据源高可用、自动熔断、极速分发的图片调用体验。</p>
          </div>
        </section>

        <section class="categories-section">
          <h2 class="section-title">推荐端点</h2>
          <div id="home-grid" class="categories-grid">
            <div class="loading-state">正在加载...</div>
          </div>
          <div style="text-align: center; margin-top: 24px;">
            <button class="btn btn-primary btn-view-more" onclick="switchTab('view-api')">查看更多 API</button>
          </div>
        </section>
      </div>

      <!-- API 视图 -->
      <div id="view-api" class="page-view hidden">
        <section class="categories-section">
          <h2 class="section-title">所有可用端点</h2>
          <div id="api-grid" class="categories-grid">
            <div class="loading-state">正在加载...</div>
          </div>
        </section>
      </div>

      <!-- 联系视图 -->
      <div id="view-contact" class="page-view hidden">
        <section class="glass-panel contact-section">
          <h2 class="section-title">联系我们</h2>
          <div class="contact-content">
            <div id="contact-image-container" style="display:none; text-align:center; margin-bottom: 24px;">
              <img id="contact-image" src="" alt="Contact" style="max-width:200px; border-radius:12px;" />
            </div>
            <div id="contact-text" style="margin-bottom: 24px; text-align:center;"></div>
            <div id="contact-socials" class="social-links" style="display:flex; gap:16px; justify-content:center;"></div>
          </div>
        </section>
      </div>
    </main>
    
    <footer class="footer">
      <div id="dynamic-footer">
        Powered by WanderStar Image Pool | <a href="https://github.com" target="_blank">Open Source</a>
      </div>
    </footer>
  </div>

  <div id="announcement-modal" class="modal-overlay">
    <div class="glass-modal announcement-card">
      <h3>📢 公告</h3>
      <div id="announcement-content" style="margin:16px 0; max-height:60vh; overflow-y:auto;"></div>
      <div style="text-align:right;">
        <button class="btn btn-primary" onclick="closeAnnouncement()">我知道了</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">复制成功!</div>

  <script src="/app.js?v=2"></script>
</body>
</html>
